
name: Generate 9Router Package Lock

on:
  push:
    branches:
      - android-compat
    paths:
      - 'package.json'
      - '.github/workflows/export-package-lock.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lock:
    name: Generate and upload package lock
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout 9Router
        uses: actions/checkout@v4
        with:
          ref: android-compat

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Generate package-lock.json
        run: |
          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --fetch-retries=5 \
            --fetch-timeout=300000

          test -s package-lock.json

      - name: Verify generated lockfile
        run: |
          node -e "
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (!p.packages || Object.keys(p.packages).length === 0) {
            throw new Error('Generated package-lock.json is empty or invalid');
          }
          console.log('Lockfile version:', p.lockfileVersion);
          console.log('Package count:', Object.keys(p.packages).length);
          console.log('File size:', fs.statSync('package-lock.json').size, 'bytes');
          "

      - name: Upload package-lock ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: 9router-package-lock
          path: package-lock.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
