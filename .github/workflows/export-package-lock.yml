
name: Generate 9Router Package Lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 9Router
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Generate package-lock.json
        run: |
          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --fetch-retries=5 \
            --fetch-timeout=300000

          test -s package-lock.json

      - name: Upload package lock
        uses: actions/upload-artifact@v4
        with:
          name: 9router-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
